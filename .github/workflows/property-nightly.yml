name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC). The fast,
# fixed-seed set runs in Tests on every push and pull request; this runs only
# the property files, with many more examples and a seed taken from the run,
# so each run explores new cases and logs the seed to replay them.
#
# `schedule` fires only from the default branch, so this copy tests the
# default branch only. It never checks out another ref: code from another ref
# run in the default branch's context could poison what that context trusts
# (CodeQL actions/cache-poisoning). Each release line keeps its own
# dispatch-only copy of this workflow.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property
        required: false
        default: '5000'

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Pinned to full commit SHAs, resolved read-only from the lightweight
      # release tags (gh api repos/actions/<action>/git/ref/tags/v4.4.0, a
      # commit object, so nothing to dereference).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The count must be a whole number from 1 to 1000000: anything else a
      # dispatch gives fails the job here (no default for a bad value). A
      # scheduled run has no input and takes the default.
      - name: Examples count
        id: examples
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.examples }}
        run: |
          node --test tools/property/examples-check.mjs
          count="$(node tools/property/examples.mjs "$EVENT" "$INPUT")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Property tests
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ steps.examples.outputs.count }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
        run: |
          echo "PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          npx vitest run test/approval-pairing-property.test.ts --reporter=verbose
