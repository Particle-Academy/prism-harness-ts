name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC). The fast,
# fixed-seed set runs in Tests on every push and pull request; this runs only
# the property files, with many more examples and a seed taken from the run,
# so each run explores new cases and logs the seed to replay them.
#
# `schedule` fires only from the default branch, so this copy runs every
# supported line as a matrix ref; each release line keeps a dispatch-only copy.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property
        required: false
        default: '5000'

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.ref }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main, release/0.11.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      # No dependency cache: this job checks out another ref (a release line)
      # in the default branch's context, so a cache it wrote could be restored
      # by a default-branch run (CodeQL actions/cache-poisoning).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Property tests
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ inputs.examples || '5000' }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
        run: |
          echo "PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          npx vitest run test/approval-pairing-property.test.ts --reporter=verbose
